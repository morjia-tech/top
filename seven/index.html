<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>スリーセブン</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f9e7a1;font-family:serif;overscroll-behavior:none}
#game{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);touch-action:none}
#unity-canvas{display:block;width:100%;height:100%;background:#000;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:22px;text-align:center;padding:24px;box-sizing:border-box}
h1{font-size:clamp(25px,6vw,42px);font-weight:normal;margin:0;letter-spacing:.12em}.track{width:min(300px,75vw);height:4px;background:#353632}#progress{height:100%;width:0;background:#cfb660}#message{font-size:16px;line-height:1.6;margin:0}button{min-width:220px;min-height:52px;font-size:18px;border:2px solid #76602f;background:#cfb660;color:#181713;touch-action:manipulation}button[hidden]{display:none}
</style>
</head>
<body>
<div id="game"><canvas id="unity-canvas" tabindex="0" aria-label="スリーセブンのゲーム画面"></canvas><div id="loading"><h1>スリーセブン</h1><div class="track"><div id="progress"></div></div><p id="message">読み込み中…</p><button id="start" hidden>はじめる</button><button id="retry" hidden>もう一度読み込む</button></div></div>
<script>
const canvas=document.getElementById('unity-canvas'), loading=document.getElementById('loading'), message=document.getElementById('message'), start=document.getElementById('start');
// Start Unity at the displayed size, including on a first visit from a phone.
canvas.width=Math.max(1,Math.round(canvas.clientWidth));canvas.height=Math.max(1,Math.round(canvas.clientHeight));
let unityInstance=null;
canvas.addEventListener('contextmenu',event=>event.preventDefault());
canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&unityInstance)unityInstance.SendMessage('Web Lifecycle','OnBrowserHidden');});
window.addEventListener('pagehide',()=>{if(unityInstance)unityInstance.SendMessage('Web Lifecycle','OnBrowserHidden');});
const config={dataUrl:'Build/37.data.unityweb',frameworkUrl:'Build/37.framework.js.unityweb',codeUrl:'Build/37.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:"Prototype",productName:"スリーセブン",productVersion:"1.0",devicePixelRatio:1,matchWebGLToCanvasSize:true,autoSyncPersistentDataPath:true,showBanner:(text,type)=>{if(type==='error')failure(text);}};
function failure(text){loading.style.display='flex';message.textContent='起動できませんでした。もう一度お試しください。';console.error(text);document.getElementById('retry').hidden=false;}
document.getElementById('retry').onclick=()=>location.reload();
start.onclick=()=>{loading.style.display='none';canvas.focus({preventScroll:true});};
const script=document.createElement('script');script.src='Build/37.loader.js';script.onload=()=>createUnityInstance(canvas,config,progress=>{document.getElementById('progress').style.width=(progress*100)+'%';}).then(instance=>{unityInstance=instance;window.unityInstance=instance;message.textContent='準備できました';start.hidden=false;}).catch(failure);script.onerror=failure;document.body.appendChild(script);
</script>
</body>
</html>
