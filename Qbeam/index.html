<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#02060b">
  <title>Qbeam | MORJIA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #02060b; color: #c9f5ff;
      font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; -webkit-touch-callout: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 22px;
      text-align: center; background: #02060b; padding: 32px; }
    h1 { font-weight: 400; letter-spacing: .25em; font-size: 32px; margin: 0; }
    progress { width: min(64vw, 280px); height: 4px; accent-color: #64e4ff; }
    #status { max-width: 32em; font-size: 13px; line-height: 1.7; opacity: .8; }
    #notice { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
      background: #211a09; color: #ffe4a6; padding: 10px; font-size: 12px; z-index: 3; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Qbeam — swipe to rotate, pinch to zoom"></canvas>
    <section id="loading" aria-live="polite"><h1>Qbeam</h1><progress id="progress" max="1" value="0"></progress>
      <div id="status">読み込み中… / Loading…</div></section>
  </main>
  <div id="notice" hidden>このブラウザーでは保存できません。設定を確認してください。<br>Browser storage is unavailable; progress cannot be saved.</div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    let game;
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('touchmove', event => event.preventDefault(), {passive: false});
    canvas.addEventListener('wheel', event => event.preventDefault(), {passive: false});
    canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll: true}));
    document.addEventListener('gesturestart', event => event.preventDefault(), {passive: false});
    try { const key = 'morjia.qbeam.storageCheck'; localStorage.setItem(key, '1'); localStorage.removeItem(key); }
    catch (error) { document.getElementById('notice').hidden = false; }
    const buildUrl = 'Build';
    const script = document.createElement('script');
    script.src = buildUrl + '/web.loader.js';
    script.onload = () => {
      createUnityInstance(canvas, {
        dataUrl: buildUrl + '/web.data.unityweb',
        frameworkUrl: buildUrl + '/web.framework.js.unityweb',
        codeUrl: buildUrl + '/web.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "MORJIA",
        productName: "Qbeam Mobile Web",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25),
        showBanner: (message, type) => {
          if (type === 'error') { document.getElementById('loading').hidden = false; status.textContent = message; }
        }
      }, progress => { document.getElementById('progress').value = progress; }).then(instance => {
        game = instance;
        document.getElementById('loading').hidden = true;
        canvas.focus({preventScroll: true});
      }).catch(error => { status.textContent = '起動できませんでした。再読み込みしてください。 / ' + error; });
    };
    script.onerror = () => { status.textContent = 'ゲームデータを読み込めませんでした。再読み込みしてください。'; };
    document.body.appendChild(script);
  </script>
</body>
</html>
